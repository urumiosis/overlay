name: Build Monika Supabase APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APKs
        run: gradle --no-daemon :admin:assembleDebug :receiver:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Monika-Supabase-Admin-and-Receiver
          path: |
            admin/build/outputs/apk/debug/admin-debug.apk
            receiver/build/outputs/apk/debug/receiver-debug.apk
